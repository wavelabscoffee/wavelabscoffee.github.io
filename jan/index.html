<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>웨이브랩스 선결제 내역</title>
<style>
  :root{--navy:#0B5F84;--navy2:#20769B;--ink:#15212B;--dim:#63737F;--line:#E4E9ED;--bg:#F4F6F8;--card:#fff;--ok:#2E7D5B}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
  header{background:var(--navy);color:#fff;padding:18px 16px;display:flex;align-items:center;gap:10px}
  header .logo{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--navy);
       display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 auto}
  header b{font-size:17px;font-weight:800}
  header span{display:block;font-size:12px;opacity:.85;font-weight:500;margin-top:1px}
  .hero{background:var(--card);border:1px solid var(--line);border-radius:16px;
        margin:16px 0;padding:18px 16px;text-align:center}
  .hero .who{font-size:16px;font-weight:700}
  .hero .big{font-size:40px;font-weight:800;color:var(--navy);line-height:1.1;margin:8px 0 2px}
  .hero .big small{font-size:18px;font-weight:700}
  .hero .sub{font-size:13px;color:var(--dim)}
  h2{font-size:13px;color:var(--dim);font-weight:700;margin:20px 2px 8px}
  .pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .pc.done{opacity:.6}
  .pc .ph{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .pc .ph b{font-size:14px}
  .badge{margin-left:auto;font-size:12px;font-weight:700;color:var(--navy);
         background:#EAF2F6;border-radius:999px;padding:3px 10px}
  .badge.ok{color:var(--ok);background:#E7F3EC}
  .it{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
  .it:first-child{border-top:0}
  .it .nm{flex:1;min-width:0}
  .it .nm b{font-weight:600}
  .it .nm em{font-style:normal;color:var(--dim);font-size:12.5px;margin-left:5px}
  .it .rem{font-weight:800;color:var(--navy);font-size:15px;white-space:nowrap}
  .it .rem.z{color:var(--dim);font-weight:600}
  .it .rem small{color:var(--dim);font-weight:600;font-size:12px}
  .memos{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--dim)}
  .memos div{margin:2px 0}
  .msg{text-align:center;color:var(--dim);padding:40px 16px}
  .foot{text-align:center;color:var(--dim);font-size:12px;margin-top:18px}
  .refresh{display:block;margin:6px auto 0;background:none;border:0;color:var(--navy);
           font-weight:700;font-size:13px;padding:8px;cursor:pointer}
</style></head>
<body>
<header><div class="logo">37F</div><div><b>웨이브랩스</b><span>선결제 내역</span></div></header>
<div class="wrap" id="app"><div class="msg">불러오는 중…</div></div>

<script>
var SUPA="https://gsnsroacvbibljpecizu.supabase.co/rest/v1/records";
var KEY="sb_publishable_eCxa1FC6BIp3L0FJwI9x5w_I-4LQ-hw";
var cid=new URLSearchParams(location.search).get("c")||location.hash.replace(/^#/,"");
function hdr(){return{apikey:KEY,Authorization:"Bearer "+KEY};}
function E(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function ymd(ms){var d=new Date(ms);return d.getFullYear()+"."+("0"+(d.getMonth()+1)).slice(-2)+"."+("0"+d.getDate()).slice(-2);}
function remOf(it){var n=0;(it.d||[]).forEach(function(x){if(!x)n++;});return n;}
function leftOf(data){var n=0;(data.items||[]).forEach(function(it){n+=remOf(it);});return n;}

function card(row){
  var d=row.data,left=leftOf(d),closed=d.closed||left===0;
  var items=(d.items||[]).map(function(it){
    var tot=(it.d||[]).length,rem=closed?0:remOf(it);
    return '<div class="it"><div class="nm"><b>'+E(it.n)+'</b>'+(it.o?'<em>'+E(it.o)+'</em>':'')+'</div>'
      +'<div class="rem'+(rem===0?' z':'')+'">'+rem+' <small>/ '+tot+'</small></div></div>';
  }).join('');
  var memos=(d.memos||[]).map(function(m){return '<div>· '+E(m.t)+'</div>';}).join('');
  return '<div class="pc'+(closed?' done':'')+'">'
    +'<div class="ph"><b>'+E(ymd(d.at||row.at))+' 선결제</b>'
    +'<span class="badge'+(closed?' ok':'')+'">'+(closed?'다 쓰셨어요':'남은 '+left+'개')+'</span></div>'
    +'<div class="items">'+items+'</div>'
    +(memos?'<div class="memos">'+memos+'</div>':'')+'</div>';
}

function render(name,rows){
  var open=[],done=[],total=0;
  rows.forEach(function(r){ var l=leftOf(r.data); total+=l;
    (r.data.closed||l===0?done:open).push(r); });
  var h='<div class="hero"><div class="who">'+E(name)+'님</div>'
    +'<div class="big">'+total+'<small> 개 남음</small></div>'
    +'<div class="sub">남은 선결제 음료·메뉴예요</div>'
    +'<button class="refresh" onclick="load()">새로고침</button></div>';
  if(!rows.length){ h+='<div class="msg">등록된 선결제 내역이 없어요.</div>'; }
  else{
    if(open.length){ h+='<h2>진행 중</h2>'+open.map(card).join(''); }
    if(done.length){ h+='<h2>다 쓰신 내역</h2>'+done.map(card).join(''); }
  }
  h+='<div class="foot">주문은 키오스크에서, 픽업 때 이 화면을 보여 주세요.<br>문의 010-8406-8985</div>';
  document.getElementById("app").innerHTML=h;
}

function load(){
  if(!cid){document.getElementById("app").innerHTML='<div class="msg">링크가 올바르지 않아요.<br>매장에서 받은 링크로 다시 열어 주세요.</div>';return;}
  Promise.all([
    fetch(SUPA+"?kind=eq.cust&id=eq."+encodeURIComponent(cid)+"&select=data",{headers:hdr()}).then(function(r){return r.json();}),
    fetch(SUPA+"?kind=eq.prepay&data->>cid=eq."+encodeURIComponent(cid)+"&select=data,at&order=at.desc",{headers:hdr()}).then(function(r){return r.json();})
  ]).then(function(res){
    var cust=res[0],pre=res[1];
    if(!cust||!cust.length){document.getElementById("app").innerHTML='<div class="msg">내역을 찾지 못했어요.<br>매장에 문의해 주세요. 010-8406-8985</div>';return;}
    render((cust[0].data&&cust[0].data.n)||"고객",pre||[]);
  }).catch(function(){
    document.getElementById("app").innerHTML='<div class="msg">잠시 불러오지 못했어요.<br><button class="refresh" onclick="load()">다시 시도</button></div>';
  });
}
load();
setInterval(load,30000);
</script>
</body></html>
